name: Deploy

# Runs after CI passes on main: backend to ECS, then frontend to Firebase Hosting. Nightly it also rebuilds just the
# frontend from the last release, so link previews pick up guide and trek edits made since (docs/TRD.md §7.16). Setup (one-time) is in
# docs/DEPLOY.md §13: an AWS role and a Google service account GitHub can assume through OIDC (no stored keys),
# plus these repository variables (Settings → Secrets and variables → Actions → Variables):
#   AWS_ROLE_ARN, ECR_REPOSITORY, ECS_CLUSTER, ECS_SERVICE, ECS_TASK_FAMILY, ECS_CONTAINER,
#   VITE_API_BASE_URL, VITE_GOOGLE_CLIENT_ID, VITE_PHONE_OTP (optional), FIREBASE_PROJECT, GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '30 21 * * *' # 03:00 IST
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1

jobs:
  backend:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          docker build -t "$IMAGE" backend
          docker push "$IMAGE"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"
      - run: aws ecs describe-task-definition --task-definition "${{ vars.ECS_TASK_FAMILY }}" --query taskDefinition > task-def.json
      - id: taskdef
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ vars.ECS_CONTAINER }}
          image: ${{ steps.image.outputs.uri }}
      # Rolling deploy; Flyway migrates on startup. Waits until the new task is healthy behind the ALB.
      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.taskdef.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          wait-for-service-stability: true

  frontend:
    needs: backend
    # The nightly run skips the backend job; the frontend still runs then.
    if: always() && (needs.backend.result == 'success' || github.event_name == 'schedule' && needs.backend.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: ${{ github.event_name == 'schedule' && '0' || '1' }}
      # Nightly: rebuild what's live (the last release tag), never unreleased commits on main.
      - if: github.event_name == 'schedule'
        run: git checkout "$(git describe --tags --abbrev=0 --match 'v[0-9]*')"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The site and the API are on different hosts, so an empty base URL would point the site at itself.
      - run: test -n "$VITE_API_BASE_URL" && npm ci && npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_PHONE_OTP: ${{ vars.VITE_PHONE_OTP }}
      # Each public page, trek and guide gets its own head tags, read from the API the backend job just deployed (docs/TRD.md §7.16).
      - run: npm run prerender
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - run: npm run check:csp
        working-directory: frontend
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      # Firebase swaps the whole site at once and purges its CDN; caching rules are in frontend/firebase.json.
      - run: npx -y firebase-tools@15 deploy --only hosting --project "${{ vars.FIREBASE_PROJECT }}" --non-interactive
        working-directory: frontend

  # Tags what just went live as vX.Y.Z and opens a GitHub Release listing the PRs since the last one (docs/DEPLOY.md §13).
  release:
    needs: frontend
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - run: |
          tags=$(gh api "repos/$REPO/tags" --paginate --jq '.[] | "\(.name) \(.commit.sha)"' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+ ' || true)
          if grep -q " $SHA$" <<<"$tags"; then echo "$SHA is already released"; exit 0; fi

          # The PR's release:* label wins; otherwise feature/ branches are minor and the rest are patch.
          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0] // {}')
          labels=$(jq -r '[.labels[]?.name] | join(" ")' <<<"$pr")
          branch=$(jq -r '.head.ref // ""' <<<"$pr")
          case " $labels " in
            *" release:major "*) bump=major ;;
            *" release:minor "*) bump=minor ;;
            *" release:patch "*) bump=patch ;;
            *) [[ $branch == feature/* ]] && bump=minor || bump=patch ;;
          esac

          last=$(cut -d' ' -f1 <<<"$tags" | sort -V | tail -1)
          if [ -z "$last" ]; then
            next=v1.0.0
          else
            IFS=. read -r major minor patch <<<"${last#v}"
            case $bump in
              major) next=v$((major + 1)).0.0 ;;
              minor) next=v$major.$((minor + 1)).0 ;;
              patch) next=v$major.$minor.$((patch + 1)) ;;
            esac
          fi

          echo "Releasing $SHA as $next ($bump, branch '${branch:-none}')"
          gh release create "$next" --repo "$REPO" --target "$SHA" --title "$next" --generate-notes ${last:+--notes-start-tag "$last"}
