# Daily uptime check of the live site and API (docs/DEPLOY.md §16). A failed run makes GitHub email whoever last
# changed this file's schedule. Free, unlike Route 53 health checks, whose slowest interval is 30 seconds.
name: Uptime

on:
  schedule:
    - cron: '30 3 * * *' # 09:00 IST
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: API health
        run: curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 20 https://api.theemptyvalley.com/api/public/health
      - name: Website
        run: curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 20 -o /dev/null https://theemptyvalley.com/
