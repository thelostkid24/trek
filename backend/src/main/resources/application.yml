spring:
  application:
    name: sahyatri
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/sahyatri}
    username: ${DB_USER:sahyatri}
    password: ${DB_PASSWORD:sahyatri}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: ${PORT:8081}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
