services:
  postgres:
    image: postgres:16-alpine
    container_name: sahyatri-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-sahyatri}
      POSTGRES_USER: ${DB_USER:-sahyatri}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sahyatri}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sahyatri} -d ${DB_NAME:-sahyatri}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
