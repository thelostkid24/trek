<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Theme before first paint (no flash): light unless the visitor picked dark with the header toggle. The
         system dark-mode setting is ignored on purpose. See src/lib/theme.ts. -->
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap"
    />
    <!-- Head tags for link previews: WhatsApp, Facebook, X and other link-preview fetchers don't run JavaScript,
         so they only see these. scripts/prerender.mjs swaps this block per trek page. main.tsx removes it on load,
         and from then on each page's <Seo> (src/components/Seo.tsx) sets the tags. Keep the markers. -->
    <!-- static-head:start -->
    <title data-static-head>The Empty Valley — Small batches. Guaranteed departures.</title>
    <meta data-static-head name="description" content="Small-batch Himalayan treks in Uttarakhand, led by certified local guides you choose. Ten trekkers at most, and every departure is guaranteed." />
    <meta data-static-head property="og:site_name" content="The Empty Valley" />
    <meta data-static-head property="og:type" content="website" />
    <meta data-static-head property="og:title" content="The Empty Valley — Small batches. Guaranteed departures." />
    <meta data-static-head property="og:description" content="Small-batch Himalayan treks in Uttarakhand, led by certified local guides you choose. Ten trekkers at most, and every departure is guaranteed." />
    <meta data-static-head property="og:image" content="https://theemptyvalley.com/hero.jpg" />
    <meta data-static-head property="og:url" content="https://theemptyvalley.com/" />
    <meta data-static-head name="twitter:card" content="summary_large_image" />
    <!-- static-head:end -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "The Empty Valley",
        "url": "https://theemptyvalley.com/",
        "logo": "https://theemptyvalley.com/favicon.svg",
        "email": "info@theemptyvalley.com",
        "description": "Small-batch Himalayan treks in Uttarakhand, led by certified local guides.",
        "areaServed": "Uttarakhand, India"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
